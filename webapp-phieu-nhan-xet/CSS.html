<style>
  /* Đồng bộ với webapp "Nộp nghiệm thu NCKH" cùng Viện — phần :root ... .version-footer
     bên dưới copy nguyên văn từ CSS.html thật của webapp đó (đã tìm lại được, xem
     reference/webapp-nghiem-thu-2026-q3/CSS.html). Phần cuối file thêm các class
     riêng cho form nhận xét (thang điểm 1-5, khối thông tin điền sẵn khoá cứng,
     thẻ "link không hợp lệ") theo đúng cùng ngôn ngữ thiết kế. */

  :root {
    --blue: #1a5b96;
    --blue-dark: #124068;
    --blue-light: #eaf2fa;
    --amber-bg: #fdf6e3;
    --amber-border: #f0d99a;
    --border: #dbe1e8;
    --text: #1f2937;
    --muted: #6b7280;
    --red: #d0342c;
    --red-dark: #a3241d;
    --green: #1e8e3e;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #eef2f6;
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 900px;
    margin: 24px auto 60px;
    padding: 0 16px;
  }

  /* ---- HERO ---- */
  .hero {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 88% 12%, rgba(255,255,255,.16), transparent 40%),
      linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: #fff;
    border-radius: 25px;
    padding: 26px 28px;
    margin-bottom: 20px;
    text-align: left;
    box-shadow: 0 14px 32px rgba(15, 75, 105, .22);
  }
  .hero-logos {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .hero-logo-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    background: #fff;
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 8px 16px rgba(6, 30, 45, .28);
  }
  .hero-logo-chip img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .hero-title {
    text-align: left;
    font-size: 21px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: .2px;
  }
  .hero-sub {
    text-align: left;
    margin-top: 6px;
    font-size: 13.5px;
    opacity: .92;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(16, 24, 40, .08);
    padding: 24px 26px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 16px;
    margin: 0 0 16px;
    color: var(--blue-dark);
    border-bottom: 2px solid var(--blue-light);
    padding-bottom: 10px;
  }

  .card-note { font-size: 13px; color: var(--muted); margin: -8px 0 18px; }

  .guide-block p { margin: 0 0 10px; }
  .guide-block a { color: var(--blue); text-decoration: none; }
  .guide-block a:hover { text-decoration: underline; }
  .guide-block a.hl-link { font-weight: 700; text-decoration: underline; }
  .guide-text { font-size: 16px; }
  .hl-yellow {
    background: #fff59d;
    padding: 1px 5px;
    border-radius: 3px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .note-box {
    background: var(--amber-bg);
    border: 1px solid var(--amber-border);
    border-radius: 14px;
    padding: 12px 14px;
    margin: 14px 0;
    font-size: 13.5px;
  }

  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 15px;
  }
  .req { color: var(--red); }

  input[type="text"],
  input[type="tel"],
  input[type="url"],
  input[type="email"],
  select,
  textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; min-height: 84px; }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(26, 91, 150, .13);
  }

  input[readonly], textarea[readonly] {
    background: #f3f5f7;
    color: #4b5563;
  }

  .hint {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .section-banner {
    background: var(--blue-light);
    border-left: 4px solid var(--blue);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 4px 0 20px;
  }
  .section-banner b { color: var(--blue-dark); }
  .section-banner-note {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .radio-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .radio-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: 600;
    background: linear-gradient(#fff, #fafbfc);
    box-shadow: 0 4px 0 #d7dee4;
    transition: transform .1s, box-shadow .1s, background .15s, border-color .15s, color .15s;
  }
  .radio-pill:active { transform: translateY(2px); box-shadow: 0 2px 0 #d7dee4; }
  .radio-pill:has(input:checked) {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue-dark);
    font-weight: 800;
    box-shadow: 0 4px 0 #9dc0dc;
    transform: translateY(-1px);
  }
  .radio-pill:has(input[value="ĐẠT"]:checked) {
    border-color: var(--green);
    background: #e6f4ea;
    color: #146029;
    box-shadow: 0 4px 0 #8fcaa2;
  }
  .radio-pill:has(input[value="KHÔNG ĐẠT"]:checked) {
    border-color: var(--red);
    background: #fdecea;
    color: var(--red-dark);
    box-shadow: 0 4px 0 #e7a9a4;
  }
  .radio-pill input { accent-color: var(--blue); }
  .radio-pill.is-disabled { opacity: .45; cursor: not-allowed; }
  .radio-pill.is-disabled:active { transform: none; }

  .submit-row {
    text-align: center;
    margin: 30px 0 10px;
  }
  .submit-btn {
    background: linear-gradient(145deg, var(--blue), var(--blue-dark));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px 42px;
    font-family: 'Montserrat', "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: .01em;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--blue-dark), 0 10px 20px rgba(18, 64, 104, .25);
    transition: transform .1s, box-shadow .1s, filter .1s;
  }
  .submit-btn:hover { filter: brightness(1.06); }
  .submit-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--blue-dark), 0 4px 10px rgba(18, 64, 104, .2);
  }
  .submit-btn:disabled {
    background: #9ab3c8;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  .submit-dots {
    display: inline-block;
    min-width: 1.1em;
    text-align: left;
    font-size: 1.5em;
    font-weight: 900;
    line-height: 0;
    vertical-align: middle;
  }
  .submit-btn.secondary {
    background: #fff;
    color: var(--blue);
    border: 1.5px solid var(--blue);
    box-shadow: 0 4px 0 #cfe0ee;
  }
  .submit-btn.secondary:hover { background: var(--blue-light); }
  .submit-btn.secondary:active { box-shadow: 0 1px 0 #cfe0ee; }

  .submit-status {
    margin-top: 12px;
    font-size: 13.5px;
  }
  .submit-status.error { color: var(--red); }
  .submit-status.info { color: var(--blue-dark); }

  .field-error {
    border-color: var(--red) !important;
    box-shadow: 0 0 0 3px rgba(208, 52, 44, .12) !important;
  }
  .score-scale.field-error { border-radius: 12px; box-shadow: 0 0 0 3px rgba(208, 52, 44, .12); }

  .success-card, .closed-card, .invalid-card {
    text-align: center;
    padding: 46px 26px;
  }
  .success-icon, .closed-icon, .invalid-icon {
    width: 56px; height: 56px;
    line-height: 56px;
    border-radius: 50%;
    font-size: 26px;
    margin: 0 auto 16px;
    display: inline-block;
  }
  .success-icon { background: #e6f4ea; color: #1e8e3e; }
  .closed-icon, .invalid-icon { background: #fdecea; color: var(--red); }
  .success-card h2, .closed-card h2, .invalid-card h2 { color: var(--blue-dark); margin: 0 0 12px; }
  .success-card p, .closed-card p, .invalid-card p { color: var(--text); margin: 4px 0; }
  .contact-box { margin-top: 14px; font-size: 13.5px; color: var(--muted); }

  .version-footer {
    text-align: center;
    font-size: 11px;
    color: #9aa4b2;
    margin: 10px 0 30px;
  }

  /* ============================= RIÊNG CHO PHIẾU NHẬN XÉT ============================= */

  /* ---- Khối thông tin điền sẵn (khoá cứng, không cho sửa) ---- */
  .readonly-field .field-pill {
    display: block; width: 100%; padding: 11px 13px;
    border: 1.5px solid var(--border); border-radius: 12px;
    background: #f3f5f7; font-size: 14px; min-height: 20px; color: #4b5563;
  }
  .readonly-field .field-pill a { color: var(--blue); font-weight: 700; text-decoration: none; }
  .readonly-field .field-pill a:hover { text-decoration: underline; }

  /* ---- Cặp file đề cương / file nghiệm thu, cạnh nhau trên cùng 1 hàng ---- */
  .file-pair { display: flex; gap: 12px; flex-wrap: wrap; }
  .file-pair-col { flex: 1 1 200px; }
  .file-pair-label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  /* File nghiệm thu: cỡ chữ lớn hơn 2 mức (14px -> 18px) + highlight vàng, vì đây
     là file người nhận xét dùng để chấm điểm. */
  .field-pill-highlight {
    background: #fff59d !important;
    border-color: #f0d99a !important;
    font-size: 18px; font-weight: 700;
  }
  .field-pill-highlight a { color: var(--blue-dark) !important; }

  .locked-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--blue); background: var(--blue-light);
    border-radius: 20px; padding: 2px 10px; margin-left: 8px; vertical-align: middle;
  }

  /* ---- Thang điểm 1-5: số ở trên + chấm tròn (bullet) bên dưới. Input radio nằm
     LỒNG trong <label> nên bấm vào số, chấm tròn, hay bất kỳ đâu trong pill đều
     chọn được — không phải chỉ bấm trúng chấm tròn mới ăn. ---- */
  .score-scale { display: flex; gap: 8px; flex-wrap: wrap; }
  /* Đặc tả ".score-scale .score-pill" (2 class) thay vì chỉ ".score-pill" (1 class)
     để chắc chắn thắng ".field label { display: block; ... }" (1 class + 1 thẻ) —
     nếu chỉ để 1 class, độ ưu tiên CSS thua rule đó và "display: flex" bị vô hiệu. */
  .score-scale .score-pill {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px;
    width: 52px; height: 64px;
    border: 1.5px solid var(--border); border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(#fff, #fafbfc);
    box-shadow: 0 4px 0 #d7dee4;
    transition: transform .1s, box-shadow .1s, background .15s, border-color .15s;
  }
  .score-scale .score-pill:active { transform: translateY(2px); box-shadow: 0 2px 0 #d7dee4; }
  .score-scale .score-num {
    font-weight: 800; font-size: 17px; color: var(--text);
    transition: color .15s;
  }
  .score-scale .score-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: #fff;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .score-scale .score-pill:has(input:checked) {
    border-color: var(--blue); background: var(--blue-light);
    box-shadow: 0 4px 0 #9dc0dc; transform: translateY(-1px);
  }
  .score-scale .score-pill:has(input:checked) .score-num { color: var(--blue-dark); }
  .score-scale .score-pill:has(input:checked) .score-dot {
    background: var(--blue); border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(26, 91, 150, .18);
  }
  .score-scale .score-pill input { position: absolute; opacity: 0; width: 0; height: 0; }
  .score-scale-caption { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; max-width: 320px; }
</style>
