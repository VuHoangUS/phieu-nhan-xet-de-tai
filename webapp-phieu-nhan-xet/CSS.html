<style>
  /* Cùng hệ màu/kiểu chữ với webapp "Nộp nghiệm thu NCKH cấp cơ sở" cùng Viện
     (xem reference/webapp-nghiem-thu-2026-q3/) — CSS.html gốc của webapp đó bị
     thiếu nên phần này được dựng lại theo đúng tên class đã thấy trong Index.html
     tham chiếu (hero, card, field, radio-pill, submit-btn, ...) để hai webapp
     nhìn đồng bộ với nhau. */

  :root {
    --brand: #1a5b96;
    --brand-dark: #124068;
    --brand-light: #eaf2fa;
    --border: #dbe1e8;
    --text: #1f2937;
    --muted: #6b7280;
    --red: #d0342c;
    --green: #1e8e3e;
    --amber: #b8860b;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: #eef2f6;
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .wrap { max-width: 900px; margin: 24px auto 60px; padding: 0 16px; }

  /* ---- Hero header card ---- */
  .hero {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 88% 12%, rgba(255,255,255,.16), transparent 40%),
      linear-gradient(135deg, var(--brand-dark), var(--brand));
    color: #fff;
    border-radius: 25px;
    padding: 26px 28px;
    margin-bottom: 20px;
    box-shadow: 0 14px 32px rgba(0, 0, 0, .22);
  }
  .hero-title { font-family: 'Hanken Grotesk', sans-serif; font-size: 22px; font-weight: 800; line-height: 1.35; }
  .hero-sub { margin-top: 6px; font-size: 13.5px; opacity: .92; }

  /* ---- Cards / fields ---- */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
    padding: 24px 26px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 16px; margin: 0 0 16px; color: var(--brand-dark);
    border-bottom: 2px solid var(--brand-light); padding-bottom: 10px;
  }
  .card-note { font-size: 13px; color: var(--muted); margin: -8px 0 18px; }
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
  .req { color: var(--red); }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  input[type="text"], input[type="url"], input[type="email"], select, textarea {
    width: 100%; padding: 11px 13px;
    border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 14px; font-family: inherit; color: var(--text); background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; min-height: 84px; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 4px rgba(26, 91, 150, .13);
  }

  /* ---- Trường điền sẵn (khoá, không cho sửa) ---- */
  input[readonly], textarea[readonly] {
    background: #f3f5f8; color: var(--text); cursor: default;
  }
  .readonly-field .field-pill {
    display: block; width: 100%; padding: 11px 13px;
    border: 1.5px solid var(--border); border-radius: 12px;
    background: #f3f5f8; font-size: 14px; min-height: 20px;
  }
  .readonly-field .field-pill a { color: var(--brand); font-weight: 700; text-decoration: none; }
  .readonly-field .field-pill a:hover { text-decoration: underline; }
  .locked-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--brand); background: var(--brand-light);
    border-radius: 20px; padding: 2px 10px; margin-left: 8px; vertical-align: middle;
  }

  /* ---- "3D" option pills (dùng chung cho radio + thang điểm 1-5) ---- */
  .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
  .radio-pill {
    display: flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--border); border-radius: 14px; padding: 10px 20px;
    cursor: pointer; font-weight: 600;
    background: linear-gradient(#fff, #fafbfc);
    box-shadow: 0 4px 0 #d7dee4;
    transition: transform .1s, box-shadow .1s, background .15s, border-color .15s, color .15s;
  }
  .radio-pill:active { transform: translateY(2px); box-shadow: 0 2px 0 #d7dee4; }
  .radio-pill:has(input:checked) {
    border-color: var(--brand); background: var(--brand-light); color: var(--brand-dark);
    font-weight: 800; box-shadow: 0 4px 0 #9dc0dc; transform: translateY(-1px);
  }
  .radio-pill:has(input[value="ĐẠT"]:checked) { border-color: var(--green); background: #e6f4ea; box-shadow: 0 4px 0 #8fcaa2; }
  .radio-pill:has(input[value="KHÔNG ĐẠT"]:checked) { border-color: var(--red); background: #fdecea; box-shadow: 0 4px 0 #e7a9a4; }
  .radio-pill.is-disabled { opacity: .45; cursor: not-allowed; }
  .radio-pill.is-disabled:active { transform: none; }

  .score-scale { display: flex; gap: 8px; flex-wrap: wrap; }
  .score-pill {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 46px;
    border: 1.5px solid var(--border); border-radius: 12px;
    cursor: pointer; font-weight: 800; font-size: 16px;
    background: linear-gradient(#fff, #fafbfc);
    box-shadow: 0 4px 0 #d7dee4;
    transition: transform .1s, box-shadow .1s, background .15s, border-color .15s, color .15s;
  }
  .score-pill:active { transform: translateY(2px); box-shadow: 0 2px 0 #d7dee4; }
  .score-pill:has(input:checked) {
    border-color: var(--brand); background: var(--brand); color: #fff;
    box-shadow: 0 4px 0 var(--brand-dark); transform: translateY(-1px);
  }
  .score-pill input { position: absolute; opacity: 0; width: 0; height: 0; }
  .score-scale-caption { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; max-width: 300px; }

  /* ---- Nút Nộp ---- */
  .submit-row { text-align: center; margin: 30px 0 10px; }
  .submit-btn {
    background: linear-gradient(145deg, var(--brand), var(--brand-dark));
    color: #fff; border: none; border-radius: 14px; padding: 15px 42px;
    font-family: 'Montserrat', "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 6px 0 var(--brand-dark), 0 10px 20px rgba(0, 0, 0, .25);
    transition: transform .1s, box-shadow .1s, filter .1s;
  }
  .submit-btn:hover { filter: brightness(1.06); }
  .submit-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-dark), 0 4px 10px rgba(0, 0, 0, .2); }
  .submit-btn:disabled { background: #9ab3c8; box-shadow: none; transform: none; cursor: not-allowed; }
  .submit-status { margin-top: 12px; font-size: 13.5px; font-weight: 600; }
  .submit-status.info { color: var(--brand-dark); }
  .submit-status.error { color: var(--red); }

  .field-error { border-color: var(--red) !important; box-shadow: 0 0 0 3px rgba(208, 52, 44, .12) !important; }

  .success-card, .closed-card, .invalid-card { text-align: center; padding: 46px 26px; }
  .success-icon, .closed-icon, .invalid-icon {
    width: 56px; height: 56px; line-height: 56px; border-radius: 50%;
    font-size: 26px; margin: 0 auto 16px; display: inline-block;
  }
  .success-icon { background: #e6f4ea; color: var(--green); }
  .closed-icon, .invalid-icon { background: #fdecea; color: var(--red); }
  .contact-box { margin-top: 14px; font-size: 13.5px; color: var(--muted); }

  .version-footer { text-align: center; font-size: 11px; color: #9aa4b2; margin: 10px 0 30px; }

  .submit-dots { display: inline-block; width: 1.4em; text-align: left; }
</style>
