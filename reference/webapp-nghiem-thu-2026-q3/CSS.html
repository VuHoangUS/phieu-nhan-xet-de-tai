<style>
  :root {
    --blue: #1a5b96;
    --blue-dark: #124068;
    --blue-light: #eaf2fa;
    --amber-bg: #fdf6e3;
    --amber-border: #f0d99a;
    --border: #dbe1e8;
    --text: #1f2937;
    --muted: #6b7280;
    --red: #d0342c;
    --red-dark: #a3241d;
    --green: #1e8e3e;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #eef2f6;
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 900px;
    margin: 24px auto 60px;
    padding: 0 16px;
  }

  /* ---- HERO (khung tiêu đề, thay cho thanh ngang topbar cũ) ---- */
  .hero {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 88% 12%, rgba(255,255,255,.16), transparent 40%),
      linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: #fff;
    border-radius: 25px;
    padding: 26px 28px;
    margin-bottom: 20px;
    text-align: left;
    box-shadow: 0 14px 32px rgba(15, 75, 105, .22);
  }
  .hero-logos {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .hero-logo-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    background: #fff;
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 8px 16px rgba(6, 30, 45, .28);
  }
  .hero-logo-chip img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .hero-title {
    text-align: left;
    font-size: 21px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: .2px;
  }
  .hero-sub {
    text-align: left;
    margin-top: 6px;
    font-size: 13.5px;
    opacity: .92;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(16, 24, 40, .08);
    padding: 24px 26px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 16px;
    margin: 0 0 16px;
    color: var(--blue-dark);
    border-bottom: 2px solid var(--blue-light);
    padding-bottom: 10px;
  }

  .guide-block p { margin: 0 0 10px; }
  .guide-block a { color: var(--blue); text-decoration: none; }
  .guide-block a:hover { text-decoration: underline; }

  /* In đậm + gạch chân cho các link quan trọng (hướng dẫn, mẫu báo cáo, mẫu tờ trình) */
  .guide-block a.hl-link { font-weight: 700; text-decoration: underline; }

  /* Phần 1: cỡ chữ lớn hơn 2px so với chữ thường (14px -> 16px) */
  .guide-text { font-size: 16px; }

  /* Highlight vàng cho các dòng dẫn "1) ...", "2) ...", "3) ..." */
  .hl-yellow {
    background: #fff59d;
    padding: 1px 5px;
    border-radius: 3px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .note-box {
    background: var(--amber-bg);
    border: 1px solid var(--amber-border);
    border-radius: 14px;
    padding: 12px 14px;
    margin: 14px 0;
    font-size: 13.5px;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 15px; /* lớn hơn 1px so với chữ thường (14px) */
  }
  .req { color: var(--red); }

  input[type="text"],
  input[type="tel"],
  input[type="url"],
  input[type="email"],
  select,
  textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(26, 91, 150, .13);
  }

  input[readonly], textarea[readonly] {
    background: #f3f5f7;
    color: #4b5563;
  }

  .hint {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .section-banner {
    background: var(--blue-light);
    border-left: 4px solid var(--blue);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 4px 0 20px;
  }
  .section-banner b { color: var(--blue-dark); }
  .section-banner-note {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .upload-box {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    margin-top: 6px;
    flex-wrap: wrap;
    background: #fbfcfd;
  }

  .file-btn {
    display: inline-block;
    padding: 9px 18px;
    background: linear-gradient(#fff, #eef2f6);
    border: 1px solid #cdd7e0;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 0 #c3ccd4;
    transition: transform .1s, box-shadow .1s;
  }
  .file-btn:hover { background: linear-gradient(#fff, #e3e8ee); }
  .file-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #c3ccd4;
  }
  .file-btn input[type="file"] {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0; overflow: hidden;
    clip: rect(0,0,0,0);
  }

  .file-name {
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
  }

  .or-divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin: 14px 0;
  }
  .or-divider::before, .or-divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid var(--border);
  }
  .or-divider span { padding: 0 12px; }

  .radio-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .radio-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: 600;
    background: linear-gradient(#fff, #fafbfc);
    box-shadow: 0 4px 0 #d7dee4;
    transition: transform .1s, box-shadow .1s, background .15s, border-color .15s, color .15s;
  }
  .radio-pill:active { transform: translateY(2px); box-shadow: 0 2px 0 #d7dee4; }
  .radio-pill:has(input:checked) {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue-dark);
    font-weight: 800;
    box-shadow: 0 4px 0 #9dc0dc;
    transform: translateY(-1px);
  }
  /* Tô màu riêng cho lựa chọn "Có" (xanh) / "Không" (đỏ) ở câu hỏi minh chứng đăng tạp chí */
  .radio-pill:has(input[value="Có"]:checked) {
    border-color: var(--green);
    background: #e6f4ea;
    color: #146029;
    box-shadow: 0 4px 0 #8fcaa2;
  }
  .radio-pill:has(input[value="Không"]:checked) {
    border-color: var(--red);
    background: #fdecea;
    color: var(--red-dark);
    box-shadow: 0 4px 0 #e7a9a4;
  }
  .radio-pill input { accent-color: var(--blue); }

  .submit-row {
    text-align: center;
    margin: 30px 0 10px;
  }
  .submit-btn {
    background: linear-gradient(145deg, var(--blue), var(--blue-dark));
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px 42px;
    font-family: 'Montserrat', "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: .01em;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--blue-dark), 0 10px 20px rgba(18, 64, 104, .25);
    transition: transform .1s, box-shadow .1s, filter .1s;
  }
  .submit-btn:hover { filter: brightness(1.06); }
  .submit-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--blue-dark), 0 4px 10px rgba(18, 64, 104, .2);
  }
  .submit-btn:disabled {
    background: #9ab3c8;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  /* Hiệu ứng "." -> ".." -> "..." trên nút Nộp trong lúc chờ xử lý (đổi mỗi 0.1s) */
  .submit-dots {
    display: inline-block;
    min-width: 1.1em;
    text-align: left;
    font-size: 1.5em;
    font-weight: 900;
    line-height: 0;
    vertical-align: middle;
  }
  .submit-btn.secondary {
    background: #fff;
    color: var(--blue);
    border: 1.5px solid var(--blue);
    box-shadow: 0 4px 0 #cfe0ee;
  }
  .submit-btn.secondary:hover { background: var(--blue-light); }
  .submit-btn.secondary:active { box-shadow: 0 1px 0 #cfe0ee; }

  .submit-status {
    margin-top: 12px;
    font-size: 13.5px;
  }
  .submit-status.error { color: var(--red); }
  .submit-status.info { color: var(--blue-dark); }

  .field-error {
    border-color: var(--red) !important;
    box-shadow: 0 0 0 3px rgba(208, 52, 44, .12) !important;
  }

  .success-card {
    text-align: center;
    padding: 46px 26px;
  }
  .success-icon {
    width: 56px; height: 56px;
    line-height: 56px;
    border-radius: 50%;
    background: #e6f4ea;
    color: #1e8e3e;
    font-size: 26px;
    margin: 0 auto 16px;
  }
  .success-card h2 { color: var(--blue-dark); margin: 0 0 12px; }
  .success-card p { color: var(--text); margin: 4px 0; }

  .closed-card {
    text-align: center;
    padding: 46px 26px;
  }
  .closed-icon {
    width: 56px; height: 56px;
    line-height: 56px;
    border-radius: 50%;
    background: #fdecea;
    color: var(--red);
    font-size: 26px;
    margin: 0 auto 16px;
  }
  .closed-card h2 { color: var(--blue-dark); margin: 0 0 12px; }
  .closed-card p { color: var(--text); margin: 4px 0; }

  /* ---- Khung đếm ngược hạn chót nộp bài (học theo trang hội nghị SLSB 2026) ---- */
  .countdown-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0d5c63, #052f33);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 22px;
    padding: 24px 20px 26px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(5, 47, 51, .35);
  }
  .countdown-caption {
    margin: 0 0 18px;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #90d2da;
  }
  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .countdown-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .countdown-unit-divider {
    border-left: 1px solid rgba(255, 255, 255, .14);
  }
  .countdown-num {
    font-family: "Hanken Grotesk", "Segoe UI", Roboto, Arial, sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 1;
    color: #fff;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .countdown-label {
    margin-top: 8px;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #90d2da;
  }
  .countdown-overdue {
    margin: 16px 0 0;
    color: #ffd7d2;
    font-weight: 700;
    font-size: 14px;
  }
  @media (max-width: 480px) {
    .countdown-num { font-size: 30px; }
    .countdown-card { padding: 20px 12px 22px; }
  }

  .version-footer {
    text-align: center;
    font-size: 11px;
    color: #9aa4b2;
    margin: 10px 0 30px;
  }
</style>
